spring:
  config:
    activate:
      on-profile: prod

  jpa:
    properties:
      hibernate:
        ddl-auto: validate


  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}


logging:
  level:
    root: ERROR
