databaseChangeLog:
#  create table list group
  - changeSet:
      id: 1
      author: Ib
      changes:
        - createTable:
            tableName: list_group
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: int


#add group id column
  - changeSet:
      id: 2
      author: Ib
      changes:
        - addColumn:
            tableName: list_item
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false

#  create add foreign keys
  - changeSet:
      id: 3
      author: Ib
      changes:
        - addForeignKeyConstraint:
            baseTableName: list_group
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_list_group_user

        - addForeignKeyConstraint:
            baseTableName: list_item
            baseColumnNames: group_id
            referencedTableName: list_group
            referencedColumnNames: id
            constraintName: fk_list_item_list_group

#  add index for quick look for list item based on group id
  - changeSet:
      id: 4
      author: Ib
      changes:
      - createIndex:
          tableName: list_item
          indexName: idx_list_item_group_id
          columns:
          - column:
              name: group_id


# Add unique constraint for user_id + group_name
  - changeSet:
      id: 5
      author: Ib
      changes:
        - addUniqueConstraint:
            columnNames: user_id, group_name
            tableName: list_group
            constraintName: unique_user_group_name
