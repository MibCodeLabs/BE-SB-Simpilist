databaseChangeLog:
  - changeSet:
      id: 1
      author: Ib
      changes:
        - createTable:
            tableName: list_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: priority
                  type: int
              - column:
                  name: status
                  type: int
                  constraints:
                    nullable: false
