databaseChangeLog:
  - changeSet:
      id: 1
      author: Ib
      changes:
        - createTable:
            tableName: group_categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: Ib
      changes:
        - addForeignKeyConstraint:
            baseTableName: group_categories
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_group_category_user


#add group category id column
  - changeSet:
      id: 3
      author: Ib
      changes:
        - addColumn:
            tableName: list_groups
            columns:
              - column:
                  name: group_category_id
                  type: BIGINT

#add foreign key
  - changeSet:
      id: 4
      author: Ib
      changes:
        - addForeignKeyConstraint:
            baseTableName: list_groups
            baseColumnNames: group_category_id
            referencedTableName: group_categories
            referencedColumnNames: id
            constraintName: fk_list_group_group_category